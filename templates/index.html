<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FitBuddy - AI Workout Generator</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    rgba(0,0,0,0.65),
                    rgba(0,0,0,0.65)
                ),
                url("/static/images/gym-bg.jpg");

            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
        }

        .container {

            width: 90%;
            max-width: 500px;

            background: rgba(20,20,20,0.92);

            padding: 30px;

            border-radius: 20px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #cccccc;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
        }

        input,
        select {

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 8px;

            font-size: 15px;
        }

        button {

            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #20c997;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>💪 FitBuddy</h1>

    <p class="subtitle">
        AI Personalized Workout Generator
    </p>


    <form action="/generate-workout"
          method="post">


        <label>Name</label>

        <input
            type="text"
            name="username"
            placeholder="Enter your name"
            required
        >


        <label>User ID</label>

        <input
            type="text"
            name="user_id"
            placeholder="Enter unique user ID"
            required
        >


        <label>Age</label>

        <input
            type="number"
            name="age"
            min="13"
            max="100"
            required
        >


        <label>Weight (kg)</label>

        <input
            type="number"
            name="weight"
            step="0.1"
            required
        >


        <label>Fitness Goal</label>

        <select name="goal" required>

            <option value="">
                Select Goal
            </option>

            <option value="weight loss">
                Weight Loss
            </option>

            <option value="muscle gain">
                Muscle Gain
            </option>

            <option value="general wellness">
                General Wellness
            </option>

            <option value="flexibility">
                Flexibility
            </option>

        </select>


        <label>Workout Intensity</label>

        <select name="intensity" required>

            <option value="">
                Select Intensity
            </option>

            <option value="low">
                Low
            </option>

            <option value="medium">
                Medium
            </option>

            <option value="high">
                High
            </option>

        </select>


        <button type="submit">
            Generate My Plan 🚀
        </button>

    </form>

</div>

</body>

</html>
